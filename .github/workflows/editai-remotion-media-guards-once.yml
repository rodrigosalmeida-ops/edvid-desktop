name: EDIT AI Remotion media guards once

on:
  push:
    branches:
      - editai-remotion-media-guards-20260827
    paths:
      - .github/workflows/editai-remotion-media-guards-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: editai-remotion-media-guards-20260827
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded media playback patch
        run: python scripts/patch-remotion-media-guards.py

      - name: Install dependencies
        run: npm ci

      - name: Verify playback guards
        run: |
          npm run typecheck
          npm run test:split-layout
          npm run test:style-layer-integration

      - name: Commit verified playback fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-remotion-media-guards-once.yml scripts/patch-remotion-media-guards.py
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add resources/remotion-template/src/Main.tsx scripts/test-split-layout.mjs package.json .github/workflows/editai-remotion-media-guards-once.yml scripts/patch-remotion-media-guards.py
          git commit -m "fix(remotion): keep playback alive on bad style media"
          git push origin HEAD:editai-remotion-media-guards-20260827
