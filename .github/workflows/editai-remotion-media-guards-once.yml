name: EDIT AI Remotion media guards once

on:
  push:
    branches:
      - editai-remotion-media-guards-20260827
    paths:
      - .github/workflows/editai-remotion-media-guards-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: editai-remotion-media-guards-20260827
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded media playback patch
        shell: python
        run: |
          from pathlib import Path

          main = Path('resources/remotion-template/src/Main.tsx')
          text = main.read_text(encoding='utf-8')

          anchor = "const clamp01 = (v: number) => clamp(v, 0, 1);\n\n"
          helper = """const clamp01 = (v: number) => clamp(v, 0, 1);

          // A extensao real do arquivo tem prioridade sobre o rotulo salvo no
          // edit-data. Um PNG marcado como video deixa o Player esperando um
          // <video> que nunca chega a readyState pronto.
          const EXTENSOES_DE_IMAGEM = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.avif', '.bmp', '.svg'];
          const EXTENSOES_DE_VIDEO = ['.mp4', '.mov', '.webm', '.m4v', '.mkv'];

          // Midia auxiliar ausente nao pode congelar o video inteiro. A base
          // cut.mp4 fica sem este fallback de proposito: sem a base nao ha video.
          export const aoFalharMidia = () => {};

          export const ehVideo = (src: string | undefined, kind: string | undefined): boolean => {
            const arquivo = String(src ?? '').split(/[?#]/u)[0].toLowerCase();
            if (EXTENSOES_DE_IMAGEM.some((ext) => arquivo.endsWith(ext))) return false;
            if (EXTENSOES_DE_VIDEO.some((ext) => arquivo.endsWith(ext))) return true;
            return kind === 'video';
          };

          """.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('Guard failed: clamp01 anchor changed')
          text = text.replace(anchor, helper, 1)

          replacements = [
            (
              "<Img src={staticFile(src)} style={{width: '100%', height: '100%', objectFit: 'cover'}} />",
              "<Img src={staticFile(src)} style={{width: '100%', height: '100%', objectFit: 'cover'}} onError={aoFalharMidia} />",
              'behind image',
            ),
            (
              """{kind === 'video'
          ? <OffthreadVideo src={staticFile(src)} muted style={{width: '100%', height: '100%', objectFit: 'cover', ...(mediaCropCss(crop) ? {clipPath: mediaCropCss(crop)} : null)}} />
          : <Img src={staticFile(src)} style={{width: '100%', height: '100%', objectFit: 'cover', ...(mediaCropCss(crop) ? {clipPath: mediaCropCss(crop)} : null)}} />}""",
              """{ehVideo(src, kind)
          ? <OffthreadVideo src={staticFile(src)} muted style={{width: '100%', height: '100%', objectFit: 'cover', ...(mediaCropCss(crop) ? {clipPath: mediaCropCss(crop)} : null)}} onError={aoFalharMidia} />
          : <Img src={staticFile(src)} style={{width: '100%', height: '100%', objectFit: 'cover', ...(mediaCropCss(crop) ? {clipPath: mediaCropCss(crop)} : null)}} onError={aoFalharMidia} />}""",
              'insert card',
            ),
            (
              """return split.kind === 'video'
    ? <OffthreadVideo src={staticFile(split.src)} muted style={style} />
    : <Img src={staticFile(split.src)} style={style} />;""",
              """return ehVideo(split.src, split.kind)
    ? <OffthreadVideo src={staticFile(split.src)} muted style={style} onError={aoFalharMidia} />
    : <Img src={staticFile(split.src)} style={style} onError={aoFalharMidia} />;""",
              'split media',
            ),
          ]
          for old, new, name in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Guard failed: {name} context changed')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          test = Path('scripts/test-split-layout.mjs')
          t = test.read_text(encoding='utf-8')
          old_import = "const { SPLIT_DIVIDER, splitGeometry } = await import(pathToFileURL(path.join(outDir, 'geom.js')).href);"
          new_import = "const { SPLIT_DIVIDER, splitGeometry, ehVideo, aoFalharMidia } = await import(pathToFileURL(path.join(outDir, 'geom.js')).href);"
          if t.count(old_import) != 1:
              raise SystemExit('Guard failed: split-layout import changed')
          t = t.replace(old_import, new_import, 1)
          marker = "  const H = 1920;\n\n"
          tests = """  const H = 1920;

          // A extensao manda no tipo da midia, inclusive quando o Remotion
          // acrescenta fragmentos de tempo ao src.
          assert.equal(ehVideo('imagens/exemplo.png', 'video'), false, 'PNG rotulado como video continua sendo imagem');
          assert.equal(ehVideo('imagens/exemplo.png#t=0,4.03', 'video'), false, 'fragmento do Remotion nao muda a extensao');
          assert.equal(ehVideo('broll/exemplo.mp4', 'image'), true, 'MP4 rotulado como imagem continua sendo video');
          assert.equal(ehVideo('sem-extensao', 'video'), true, 'sem extensao conhecida o rotulo continua valendo');
          assert.doesNotThrow(() => aoFalharMidia(), 'falha de midia auxiliar precisa ser tolerada');

          """.replace('          ', '')
          if t.count(marker) != 1:
              raise SystemExit('Guard failed: split-layout test marker changed')
          t = t.replace(marker, tests, 1)
          test.write_text(t, encoding='utf-8')

          pkg = Path('package.json')
          p = pkg.read_text(encoding='utf-8')
          old = 'npm run test:style-layer-integration && npm run test:editai-diagnostics'
          new = 'npm run test:style-layer-integration && npm run test:split-layout && npm run test:editai-diagnostics'
          if p.count(old) != 1:
              raise SystemExit('Guard failed: verify:editai chain changed')
          pkg.write_text(p.replace(old, new, 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Verify playback guards
        run: |
          npm run typecheck
          npm run test:split-layout
          npm run test:style-layer-integration

      - name: Commit verified playback fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-remotion-media-guards-once.yml
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add resources/remotion-template/src/Main.tsx scripts/test-split-layout.mjs package.json .github/workflows/editai-remotion-media-guards-once.yml
          git commit -m "fix(remotion): keep playback alive on bad style media"
          git push origin HEAD:editai-remotion-media-guards-20260827
