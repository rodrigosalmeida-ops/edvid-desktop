name: EDIT AI QA smoke and IPC fix once

on:
  push:
    branches:
      - editai-qa-smoke-ipc-20260828
    paths:
      - .github/workflows/editai-qa-smoke-ipc-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: editai-qa-smoke-ipc-20260828
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded QA and IPC patch
        shell: python
        run: |
          from pathlib import Path

          # 1) O smoke do pacote intermediario deve validar somente que o
          # Electron empacotado sobe. Os runtimes pesados sao exercitados
          # depois, no app instalado + E2E real.
          smoke = Path('scripts/editai-smoke-windows.ps1')
          text = smoke.read_text(encoding='utf-8')
          old = """  [int]$TimeoutSeconds = 240,\n  [switch]$EnsureRuntimePack\n)"""
          new = """  [int]$TimeoutSeconds = 240,\n  [switch]$EnsureRuntimePack,\n  [switch]$BootOnly\n)"""
          if old not in text:
              raise SystemExit('Guard failed: smoke parameter context changed')
          text = text.replace(old, new, 1)
          old = """$arguments = @('--editai-smoke', $arg)\nif ($EnsureRuntimePack) { $arguments += '--editai-smoke-ensure-runtime' }"""
          new = """$arguments = @('--editai-smoke', $arg)\nif ($EnsureRuntimePack) { $arguments += '--editai-smoke-ensure-runtime' }\nif ($BootOnly) { $arguments += '--editai-smoke-boot-only' }"""
          if old not in text:
              raise SystemExit('Guard failed: smoke arguments context changed')
          text = text.replace(old, new, 1)
          old = """if (-not $report.ok) { throw 'Relatorio smoke marcou ok=false.' }\n$required = @('node','npm','ffmpeg','ffprobe','uv','yt-dlp','python','whisperx')\nforeach ($name in $required) {\n  $item = @($report.runtimes | Where-Object { $_.name -eq $name }) | Select-Object -First 1\n  if (-not $item) { throw \"Runtime ausente no relatorio: $name\" }\n  if (-not $item.available) { throw \"Runtime indisponivel: $name - $($item.error)\" }\n}\nWrite-Host \"[EDIT AI] smoke PASS - $($required.Count) runtimes disponiveis.\""""
          new = """if (-not $report.ok) { throw 'Relatorio smoke marcou ok=false.' }\nif ($BootOnly) {\n  if ($report.mode -ne 'boot') { throw 'Smoke boot-only nao foi reconhecido pelo executavel.' }\n  Write-Host '[EDIT AI] smoke boot PASS - Electron empacotado iniciou e respondeu.'\n} else {\n  $required = @('node','npm','ffmpeg','ffprobe','uv','yt-dlp','python','whisperx')\n  foreach ($name in $required) {\n    $item = @($report.runtimes | Where-Object { $_.name -eq $name }) | Select-Object -First 1\n    if (-not $item) { throw \"Runtime ausente no relatorio: $name\" }\n    if (-not $item.available) { throw \"Runtime indisponivel: $name - $($item.error)\" }\n  }\n  Write-Host \"[EDIT AI] smoke PASS - $($required.Count) runtimes disponiveis.\"\n}"""
          if old not in text:
              raise SystemExit('Guard failed: smoke report validation context changed')
          smoke.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2) Modo boot-only no processo principal: nenhuma hidratacao ou
          # spawn de runtime pesado, apenas prova que o Electron empacotado
          # chegou ao main process e consegue escrever o relatorio.
          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          old = """  const shouldEnsureRuntimePack = process.argv.includes('--editai-smoke-ensure-runtime');\n  const runtimePackReady = shouldEnsureRuntimePack\n    ? (await ensureRuntimePack()).status === 'ready'\n    : await runtimePackIsReady().catch(() => false);\n  const runtimes = await Promise.all(runtimeCommands.map(({ name, args }) => {\n    const resolution = resolveRuntime(name, appRuntimeContext());\n    return checkRuntime(resolution, args);\n  }));\n  const ok = runtimePackReady && runtimes.every((item) => item.available);\n  const report = {\n    schemaVersion: 1,\n    generatedAt: new Date().toISOString(),\n    ok,\n    platform: process.platform,\n    arch: process.arch,\n    appVersion: app.getVersion(),\n    electronVersion: process.versions.electron,\n    runtimePackReady,\n    runtimes,\n  };"""
          new = """  const bootOnly = process.argv.includes('--editai-smoke-boot-only');\n  const shouldEnsureRuntimePack = process.argv.includes('--editai-smoke-ensure-runtime');\n  const runtimePackReady = bootOnly\n    ? false\n    : shouldEnsureRuntimePack\n      ? (await ensureRuntimePack()).status === 'ready'\n      : await runtimePackIsReady().catch(() => false);\n  const runtimes = bootOnly\n    ? []\n    : await Promise.all(runtimeCommands.map(({ name, args }) => {\n      const resolution = resolveRuntime(name, appRuntimeContext());\n      return checkRuntime(resolution, args);\n    }));\n  const ok = bootOnly || (runtimePackReady && runtimes.every((item) => item.available));\n  const report = {\n    schemaVersion: 1,\n    generatedAt: new Date().toISOString(),\n    mode: bootOnly ? 'boot' : 'runtime',\n    ok,\n    platform: process.platform,\n    arch: process.arch,\n    appVersion: app.getVersion(),\n    electronVersion: process.versions.electron,\n    runtimePackReady,\n    runtimes,\n  };"""
          if old not in text:
              raise SystemExit('Guard failed: runEditAiSmokeIfRequested context changed')
          text = text.replace(old, new, 1)

          # 3) Remove o SEGUNDO registro duplicado do IPC de sugestao de prompt.
          marker = "  ipcMain.handle('preview:suggest-split-prompt', async ("
          positions = []
          start = 0
          while True:
              pos = text.find(marker, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + 1
          if len(positions) != 2:
              raise SystemExit(f'Guard failed: expected 2 suggest-split-prompt handlers, found {len(positions)}')
          second = positions[1]
          end_marker = "\n\n  ipcMain.handle('video:fulfill'"
          end = text.find(end_marker, second)
          if end < 0:
              raise SystemExit('Guard failed: duplicate IPC end marker not found')
          text = text[:second] + text[end + 2:]
          main.write_text(text, encoding='utf-8')

          # 4) Nao abre mais o pacote fat de ~894 MB no caminho critico do build.
          build = Path('scripts/editai-build-windows.ps1')
          text = build.read_text(encoding='utf-8')
          old = """if ($Mode -eq 'qa') {\n  Write-Host '[EDIT AI] 9/12 smoke do pacote fat antes do instalador thin'\n  & powershell -ExecutionPolicy Bypass -File scripts/editai-smoke-windows.ps1\n  if ($LASTEXITCODE -ne 0) { throw 'Smoke test do executavel empacotado falhou.' }\n  & powershell -ExecutionPolicy Bypass -File scripts/editai-media-smoke-windows.ps1\n  if ($LASTEXITCODE -ne 0) { throw 'Media smoke FFmpeg/FFprobe falhou.' }\n}"""
          new = """if ($Mode -eq 'qa') {\n  Write-Host '[EDIT AI] 9/12 validando FFmpeg/FFprobe staged antes do instalador thin'\n  & powershell -ExecutionPolicy Bypass -File scripts/editai-media-smoke-windows.ps1\n  if ($LASTEXITCODE -ne 0) { throw 'Media smoke FFmpeg/FFprobe falhou.' }\n}"""
          if old not in text:
              raise SystemExit('Guard failed: fat smoke build context changed')
          build.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 5) O workflow prova o boot do pacote THIN; a prova completa de
          # runtimes permanece no app instalado e no E2E real.
          wf = Path('.github/workflows/editai-rc2-windows.yml')
          text = wf.read_text(encoding='utf-8')
          old = """      - name: Smoke packaged EDIT AI executable\n        shell: powershell\n        run: npm run smoke:editai:win -- -ExecutablePath \"out\\EDIT AI-fat-win32-x64\\EDIT AI.exe\""""
          new = """      - name: Smoke packaged thin EDIT AI executable\n        shell: powershell\n        run: npm run smoke:editai:win -- -ExecutablePath \"out\\EDIT AI-win32-x64\\EDIT AI.exe\" -BootOnly"""
          if old not in text:
              raise SystemExit('Guard failed: packaged smoke workflow context changed')
          wf.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 6) Regressao: um unico IPC e QA thin no ponto certo.
          test = Path('scripts/test-editai-diagnostics.mjs')
          text = test.read_text(encoding='utf-8')
          old = """  // O QA fat embute perto de 1 GB de runtimes. O cold-start do Windows 2025\n  // ja ultrapassou 120 s mesmo com verify:editai verde; esse contrato impede\n  // reintroduzir um timeout que mede o I/O do runner em vez do aplicativo.\n  const smokeScript = readFileSync(path.join(root, 'scripts', 'editai-smoke-windows.ps1'), 'utf8');\n  const timeout = /\\[int\\]\\$TimeoutSeconds\\s*=\\s*(\\d+)/u.exec(smokeScript);\n  assert.ok(timeout, 'smoke Windows precisa declarar TimeoutSeconds');\n  assert.ok(Number(timeout[1]) >= 240, 'smoke do pacote fat precisa tolerar cold-start de pelo menos 240 s');\n  assert.match(smokeScript, /Smoke test excedeu \\$\\{TimeoutSeconds\\}s\\./u);\n\n  console.log('test:editai-diagnostics ok — diagnóstico seguro e timeout do smoke fat protegidos.');"""
          new = """  // O smoke de boot deve usar o pacote THIN. O pacote fat (~894 MB) e\n  // preservado como artefato, mas seus runtimes sao exercitados depois no app\n  // instalado e no E2E real, evitando medir antivirus/I/O como se fosse boot.\n  const smokeScript = readFileSync(path.join(root, 'scripts', 'editai-smoke-windows.ps1'), 'utf8');\n  const timeout = /\\[int\\]\\$TimeoutSeconds\\s*=\\s*(\\d+)/u.exec(smokeScript);\n  assert.ok(timeout, 'smoke Windows precisa declarar TimeoutSeconds');\n  assert.ok(Number(timeout[1]) >= 240, 'smoke runtime precisa manter margem para Windows frio');\n  assert.match(smokeScript, /\\[switch\\]\\$BootOnly/u);\n  assert.match(smokeScript, /--editai-smoke-boot-only/u);\n\n  const buildScript = readFileSync(path.join(root, 'scripts', 'editai-build-windows.ps1'), 'utf8');\n  assert.doesNotMatch(buildScript, /9\\/12 smoke do pacote fat/u);\n  const workflow = readFileSync(path.join(root, '.github', 'workflows', 'editai-rc2-windows.yml'), 'utf8');\n  assert.match(workflow, /out\\\\EDIT AI-win32-x64\\\\EDIT AI\\.exe.*-BootOnly/u);\n  assert.doesNotMatch(workflow, /Smoke packaged EDIT AI executable[\\s\\S]{0,250}?EDIT AI-fat-win32-x64/u);\n\n  const mainSource = readFileSync(path.join(root, 'src', 'main.ts'), 'utf8');\n  const splitPromptHandlers = mainSource.match(/ipcMain\\.handle\\('preview:suggest-split-prompt'/gu) ?? [];\n  assert.equal(splitPromptHandlers.length, 1, 'preview:suggest-split-prompt deve ser registrado uma unica vez');\n  assert.match(mainSource, /--editai-smoke-boot-only/u);\n\n  console.log('test:editai-diagnostics ok — diagnostico seguro, smoke thin e IPC unico protegidos.');"""
          if old not in text:
              raise SystemExit('Guard failed: diagnostics regression context changed')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Verify guarded changes
        run: |
          npm run typecheck
          npm run test:editai-diagnostics
          npm run test:marked-media-batch

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-qa-smoke-ipc-once.yml
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts scripts/editai-smoke-windows.ps1 scripts/editai-build-windows.ps1 scripts/test-editai-diagnostics.mjs .github/workflows/editai-rc2-windows.yml .github/workflows/editai-qa-smoke-ipc-once.yml
          git commit -m "fix(qa): smoke thin package and dedupe split prompt IPC"
          git push origin HEAD:editai-qa-smoke-ipc-20260828
