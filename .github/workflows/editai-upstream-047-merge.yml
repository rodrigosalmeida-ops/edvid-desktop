name: EDIT AI Upstream 0.47 Merge Lab

on:
  push:
    branches:
      - editai-upstream-047
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cherry-pick-upstream-047:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[047-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: editai-upstream-047
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "EDIT AI Merge Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch approved upstream 0.47.0 commit
        run: |
          git remote add upstream https://github.com/fillrochaa/edvid-desktop.git || true
          git fetch --no-tags upstream 2bfadfd619e39c87704c08f37d4e02f92da7d9f2

      - name: Apply and conservatively resolve upstream 0.47.0
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git cherry-pick 2bfadfd619e39c87704c08f37d4e02f92da7d9f2
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            mkdir -p merge-evidence
            git status --short > merge-evidence/status-before.txt
            git diff --name-only --diff-filter=U > merge-evidence/conflicts.txt
            git diff --cc > merge-evidence/conflicts.diff || true

            for file in agent.md package.json; do
              if git ls-files -u -- "$file" | grep -q .; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            for file in src/main.ts src/qa-browser-api.ts src/shared.ts src/styles.css src/App.tsx; do
              if git ls-files -u -- "$file" | grep -q .; then
                git show ":1:$file" > /tmp/base || true
                git show ":2:$file" > /tmp/ours || true
                git show ":3:$file" > /tmp/theirs || true
                git merge-file --union /tmp/ours /tmp/base /tmp/theirs || true
                cp /tmp/ours "$file"
                git add "$file"
              fi
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U > merge-evidence/unresolved.txt
              exit 1
            fi

            python scripts/editai-merge-repair-047.py
            git add src/App.tsx
            GIT_EDITOR=true git cherry-pick --continue
          fi

          git commit --amend -m "feat(editai): integrate upstream 0.47.0 [047-applied]"
          git diff HEAD^ HEAD --stat | tee merge-evidence-stat.txt
          git diff HEAD^ HEAD > merge-candidate.diff

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck merged candidate
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Timeline tests merged candidate
        id: timeline
        continue-on-error: true
        run: npm run test:timeline

      - name: Upload merge candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editai-upstream-047-merge-candidate
          if-no-files-found: warn
          path: |
            merge-evidence/**
            merge-evidence-stat.txt
            merge-candidate.diff
            src/App.tsx
            src/main.ts
            src/shared.ts
            src/styles.css
            src/qa-browser-api.ts
            src/timeline-model.ts

      - name: Gate merged candidate
        if: steps.typecheck.outcome != 'success' || steps.timeline.outcome != 'success'
        run: exit 1

      - name: Push integrated commit
        run: git push origin HEAD:editai-upstream-047
