name: EDIT AI style-layer integration v3 once

on:
  push:
    branches:
      - editai-style-layer-integration-20260827
    paths:
      - .github/workflows/editai-style-layer-integration-v3-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editai-style-layer-integration-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded integration
        shell: python
        run: |
          from pathlib import Path
          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          old_import = "import { FilaDeTrabalho } from './work-queue';"
          if old_import not in text: raise SystemExit('work-queue import changed')
          text = text.replace(old_import, old_import + "\nimport { STYLE_LAYERS, mergeStyleLayers, type StyleLayer } from './style-layers';", 1)
          start = text.find('async function writeEditData(')
          end = text.find('\n}\n', start)
          if start < 0 or end < 0: raise SystemExit('writeEditData boundary changed')
          body = text[start:end+3]
          sig_old = "    segments: readonly PlanSegment[];\n  },\n): Promise<{ splits: number; flashes: number }> {"
          sig_new = "    segments: readonly PlanSegment[];\n  },\n  layers: readonly StyleLayer[] = STYLE_LAYERS,\n): Promise<{ splits: number; flashes: number }> {"
          if sig_old not in body: raise SystemExit('writeEditData signature changed')
          body = body.replace(sig_old, sig_new, 1)
          if '  const document: Record<string, unknown> = {' not in body: raise SystemExit('document declaration changed')
          body = body.replace('  const document: Record<string, unknown> = {', '  const completeDocument: Record<string, unknown> = {', 1)
          write_marker = "  await writeFile(file, `${JSON.stringify(document, null, 2)}\\n`);"
          if write_marker not in body: raise SystemExit('write marker changed')
          body = body.replace(write_marker, "  const document = mergeStyleLayers({ previous, next: completeDocument, layers });\n" + write_marker, 1)
          return_old = "  return { splits: splits.length, flashes: animations.filter(ehFlash).length };\n  // Se a trilha ja estiver na pasta, liga na hora.\n  await ensureSoundtrackFile(path.resolve(publicDirectory, '..', '..', '..'), publicDirectory).catch(() => {});"
          return_new = "  // Se a trilha ja estiver na pasta, liga na hora.\n  await ensureSoundtrackFile(path.resolve(publicDirectory, '..', '..', '..'), publicDirectory).catch(() => {});\n  const finalSplits = Array.isArray(document.splits) ? document.splits : [];\n  const finalAnimations = Array.isArray(document.animations) ? (document.animations as Record<string, unknown>[]) : [];\n  return { splits: finalSplits.length, flashes: finalAnimations.filter(ehFlash).length };"
          if return_old not in body: raise SystemExit('return/soundtrack block changed')
          body = body.replace(return_old, return_new, 1)
          main.write_text(text[:start] + body + text[end+3:], encoding='utf-8')

          Path('scripts/test-style-layer-integration.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const source = readFileSync(path.join(root, 'src', 'main.ts'), 'utf8');
          const start = source.indexOf('async function writeEditData(');
          const end = source.indexOf(String.fromCharCode(10) + '}' + String.fromCharCode(10), start);
          assert.ok(start >= 0 && end > start);
          const body = source.slice(start, end + 3);
          assert.match(source, /STYLE_LAYERS, mergeStyleLayers, type StyleLayer/u);
          assert.match(body, /layers: readonly StyleLayer\[\] = STYLE_LAYERS/u);
          assert.match(body, /mergeStyleLayers\(\{ previous, next: completeDocument, layers \}\)/u);
          const soundtrack = body.indexOf('ensureSoundtrackFile');
          const result = body.indexOf('return { splits: finalSplits.length');
          assert.ok(soundtrack > 0 && result > soundtrack, 'soundtrack must execute before return');
          assert.match(body, /finalSplits = Array\.isArray\(document\.splits\)/u);
          console.log('test:style-layer-integration ok');
          """.replace('          ', ''), encoding='utf-8')

          phase = Path('scripts/test-phase2-data.mjs')
          p2 = phase.read_text(encoding='utf-8')
          old = "  // O número volta para a interface: é o que permite dizer \"deixei 4 espaços\n  // na timeline\" em vez de repetir \"estilos aplicados\".\n  assert.ok(/return \\{ splits: splits\\.length/u.test(corpoEscrita));\n"
          new = "  // A contagem volta para a interface a partir do documento efetivamente escrito.\n  // Com aplicação parcial, o plano cru pode ter zero splits enquanto uma tela dividida anterior é preservada.\n  assert.ok(/mergeStyleLayers\\(/u.test(corpoEscrita), 'writeEditData precisa mesclar apenas as camadas aplicadas');\n  assert.ok(/return \\{ splits: finalSplits\\.length/u.test(corpoEscrita), 'a contagem deve refletir o documento escrito');\n  const soundtrackPos = corpoEscrita.indexOf('ensureSoundtrackFile');\n  const returnPos = corpoEscrita.indexOf('return { splits: finalSplits.length');\n  assert.ok(soundtrackPos > 0 && returnPos > soundtrackPos, 'a trilha precisa ser habilitada antes do return');\n"
          if old not in p2: raise SystemExit('phase2 count assertion changed')
          phase.write_text(p2.replace(old, new, 1), encoding='utf-8')

          package = Path('package.json')
          pkg = package.read_text(encoding='utf-8')
          marker = '    "test:style-layers": "node scripts/test-style-layers.mjs",\n'
          if marker not in pkg: raise SystemExit('style-layer script marker changed')
          pkg = pkg.replace(marker, marker + '    "test:style-layer-integration": "node scripts/test-style-layer-integration.mjs",\n', 1)
          chain = 'npm run test:style-layers && npm run test:editai-diagnostics'
          if chain not in pkg: raise SystemExit('verify chain changed')
          pkg = pkg.replace(chain, 'npm run test:style-layers && npm run test:style-layer-integration && npm run test:editai-diagnostics', 1)
          package.write_text(pkg, encoding='utf-8')
      - run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm run test:style-layers
          npm run test:style-layer-integration
          npm run test:phase2-data
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-style-layer-integration-once.yml
          rm .github/workflows/editai-style-layer-integration-v2-once.yml
          rm .github/workflows/editai-style-layer-integration-v3-once.yml
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts scripts/test-style-layer-integration.mjs scripts/test-phase2-data.mjs package.json .github/workflows/editai-style-layer-integration-once.yml .github/workflows/editai-style-layer-integration-v2-once.yml .github/workflows/editai-style-layer-integration-v3-once.yml
          git commit -m "fix(styles): preserve unrelated layers when writing edit data"
          git push origin HEAD:editai-style-layer-integration-20260827
