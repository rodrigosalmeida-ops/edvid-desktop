name: EDIT AI style preview patch

on:
  push:
    branches:
      - editai-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          old = "    localStorage.setItem(styleStorageKey(projectDirectory), JSON.stringify(escolhas));\n    setStyleApplied(true);\n    // A trilha, quando escolhida, foi PEDIDA pelo app na montagem. Gerar aqui\n"
          new = "    localStorage.setItem(styleStorageKey(projectDirectory), JSON.stringify(escolhas));\n    setStyleApplied(true);\n    // Camadas locais podem mudar o edit-data sem chamar o agente. Releia o\n    // workspace para refletir legenda/texto imediatamente na prévia e faixas.\n    await refreshWorkspace();\n    // A trilha, quando escolhida, foi PEDIDA pelo app na montagem. Gerar aqui\n"
          if old not in app:
              raise SystemExit('applyStyleSelection anchor not found')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          test_path = Path('scripts/test-style-layer-integration.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = "assert.match(app, /async function applyStyleSelection\\(layer: StyleLayer\\)[\\s\\S]{0,2200}?buildPhase2\\(projectDirectory, escolhas, \\[layer\\]\\)/u, 'renderer aplica somente a camada escolhida');\n"
          extra = "const applyStyleStart = app.indexOf('async function applyStyleSelection(layer: StyleLayer)');\nconst applyStyleEnd = app.indexOf('\\n  async function approveCleanCut(', applyStyleStart);\nassert.ok(applyStyleStart >= 0 && applyStyleEnd > applyStyleStart, 'applyStyleSelection precisa ser isolável no renderer');\nconst applyStyleBody = app.slice(applyStyleStart, applyStyleEnd);\nconst buildIndex = applyStyleBody.indexOf('buildPhase2(projectDirectory, escolhas, [layer])');\nconst refreshIndex = applyStyleBody.indexOf('await refreshWorkspace()');\nassert.ok(buildIndex >= 0 && refreshIndex > buildIndex, 'aplicar estilo precisa recarregar workspace/prévia depois de persistir a camada');\n"
          if anchor not in test:
              raise SystemExit('style integration test anchor not found')
          test_path.write_text(test.replace(anchor, anchor + extra, 1), encoding='utf-8')
          Path('.github/workflows/editai-style-refresh-patch.yml').unlink()
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run test:style-layer-integration
      - name: Commit
        run: |
          git config user.name "EDIT AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx scripts/test-style-layer-integration.mjs .github/workflows/editai-style-refresh-patch.yml
          git commit -m "fix(styles): refresh live preview after layer apply"
          git push origin HEAD:editai-v1
