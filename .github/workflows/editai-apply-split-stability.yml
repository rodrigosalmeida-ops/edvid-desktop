name: EDIT AI apply split stability patch

on:
  push:
    branches: [editai-v1]
    paths:
      - .github/workflows/editai-apply-split-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editai-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep base video mounted across split transitions
        shell: python
        run: |
          from pathlib import Path
          main = Path('resources/remotion-template/src/Main.tsx')
          text = main.read_text(encoding='utf-8')
          old = '''      {s && g ? (\n        <div style={{position: 'absolute', left: 0, width, height: g.videoHeight, top: g.videoTop, overflow: 'hidden'}}>\n          <div style={{position: 'absolute', left: 0, top: 0, width, height, transform: `translateY(${g.videoOffset}px)`}}>\n            <DynamicVideo />\n          </div>\n        </div>\n      ) : (\n        <DynamicVideo />\n      )}\n'''
          new = '''      {/* O video-base permanece na MESMA posicao da arvore React.\n          Trocar entre um DynamicVideo solto e outro dentro de containers\n          desmontava/remontava o elemento no quadro da emenda, causando preto\n          ou frame congelado. Agora somente a geometria muda. */}\n      <div\n        style={{\n          position: 'absolute',\n          left: 0,\n          width,\n          height: g ? g.videoHeight : height,\n          top: g ? g.videoTop : 0,\n          overflow: 'hidden',\n        }}\n      >\n        <div\n          style={{\n            position: 'absolute',\n            left: 0,\n            top: 0,\n            width,\n            height,\n            transform: `translateY(${g ? g.videoOffset : 0}px)`,\n          }}\n        >\n          <DynamicVideo />\n        </div>\n      </div>\n'''
          if text.count(old) != 1:
              raise SystemExit('BaseWithSplits antigo nao foi encontrado exatamente uma vez')
          main.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('scripts/test-split-layout.mjs')
          t = test.read_text(encoding='utf-8')
          anchor = "  // 1. A divisa NAO fica no meio — a regressao que o aluno viu no video.\n"
          regression = '''  // O video-base deve existir em um unico caminho estrutural. Um ternario\n  // com <DynamicVideo /> nos dois ramos remonta o elemento na emenda e produz\n  // frame preto/congelado no Player.\n  const baseStart = mainSource.indexOf('const BaseWithSplits: React.FC');\n  const baseEnd = mainSource.indexOf('// ============ SOUNDTRACK', baseStart);\n  const baseSource = mainSource.slice(baseStart, baseEnd);\n  assert.equal((baseSource.match(/<DynamicVideo \\/>/g) || []).length, 1, 'video-base precisa ter uma unica montagem React');\n  assert.ok(!baseSource.includes('{s && g ? ('), 'BaseWithSplits nao pode voltar ao ternario que remonta o video');\n  assert.ok(baseSource.includes('height: g ? g.videoHeight : height'), 'sem split o container precisa continuar ocupando o quadro inteiro');\n  assert.ok(baseSource.includes('translateY(${g ? g.videoOffset : 0}px)'), 'o deslocamento muda por estilo, nao por montagem');\n\n'''
          if regression not in t:
              if anchor not in t:
                  raise SystemExit('ancora do teste split nao encontrada')
              t = t.replace(anchor, regression + anchor)
              test.write_text(t, encoding='utf-8')
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate focused block
        run: npm run typecheck && npm run test:split-layout
      - name: Commit patch
        run: |
          git config user.name "EDIT AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add resources/remotion-template/src/Main.tsx scripts/test-split-layout.mjs
          git commit -m "fix(preview): keep base video mounted across splits"
          git push origin HEAD:editai-v1
