name: EDIT AI media request core once

on:
  push:
    branches:
      - editai-media-request-core-20260828
    paths:
      - .github/workflows/editai-media-request-core-once.yml

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editai-media-request-core-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Port pure media request contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch https://github.com/fillrochaa/edvid-desktop.git 655a7f2e2c616e35df6526e03d07d1a6d2250adc
          git show FETCH_HEAD:src/media-request.ts > src/media-request.ts
          git show FETCH_HEAD:scripts/test-media-request.mjs > scripts/test-media-request.mjs
          python - <<'PY'
          from pathlib import Path
          for file in ['src/media-request.ts','scripts/test-media-request.mjs']:
              p=Path(file)
              text=p.read_text(encoding='utf-8').replace('Edvid','EDIT AI').replace('edvid-pedido-','editai-pedido-')
              # Make the standalone test platform-neutral: compile with the TS JS API
              # already present rather than invoking platform-specific shims.
              p.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - name: Verify pure media request contract
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node scripts/test-media-request.mjs
      - name: Commit verified core
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-media-request-core-once.yml
          git config user.name editai-ci
          git config user.email actions@users.noreply.github.com
          git add src/media-request.ts scripts/test-media-request.mjs .github/workflows/editai-media-request-core-once.yml
          git commit -m "feat(media): define prompt window placement contract"
          git push origin HEAD:editai-media-request-core-20260828
