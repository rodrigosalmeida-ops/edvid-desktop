name: EDIT AI style tabs v4

on:
  push:
    branches:
      - editai-style-tabs-20260827
    paths:
      - .github/workflows/editai-style-tabs-v4.yml

permissions:
  contents: write

jobs:
  validate-style-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: editai-style-tabs-20260827
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded patch
        run: python .github/scripts/patch-style-tabs.py

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm run test:style-tabs
          npm run test:style-layers
          npm run test:style-layer-integration
          npm run test:phase2-data

      - name: Commit clean functional change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/editai-style-tabs-once.yml
          rm -f .github/workflows/editai-style-tabs-v2.yml
          rm -f .github/workflows/editai-style-tabs-v3.yml
          rm -f .github/workflows/editai-style-tabs-v4.yml
          rm -f .github/scripts/patch-style-tabs.py
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(styles): add contextual layer tabs"
          git push origin HEAD:editai-style-tabs-20260827
