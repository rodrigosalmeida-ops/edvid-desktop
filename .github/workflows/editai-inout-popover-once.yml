name: EDIT AI In-Out popover once

on:
  push:
    branches:
      - editai-inout-popover-20260828
    paths:
      - .github/workflows/editai-inout-popover-once.yml

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: editai-inout-popover-20260828
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch upstream feature
        shell: bash
        run: |
          git remote add upstream https://github.com/fillrochaa/edvid-desktop.git || true
          git fetch upstream 347605d6b4c1c2339b5beecce054ed8ec63a3b08
      - name: Port safe UI and contracts, then adapt EDIT AI backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name editai-ci
          git config user.email actions@users.noreply.github.com
          if ! git cherry-pick 347605d6b4c1c2339b5beecce054ed8ec63a3b08; then
            git checkout --ours agent.md scripts/test-edit-data-edits.mjs scripts/test-phase2-data.mjs src/main.ts
            git add agent.md scripts/test-edit-data-edits.mjs scripts/test-phase2-data.mjs src/main.ts
            git cherry-pick --continue
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess, re, json
          upstream = subprocess.check_output(['git','show','347605d6b4c1c2339b5beecce054ed8ec63a3b08:src/main.ts'], text=True)
          main = Path('src/main.ts')
          text = main.read_text()
          # Port generateAtMark + attachAtMark using the current EDIT AI fulfill/placeGeneratedMedia backend.
          a = upstream.index('async function generateAtMark(')
          b = upstream.index('// O aluno DESCREVE a faixa', a)
          block = upstream[a:b]
          marker = '// O aluno DESCREVE a faixa'
          if 'async function generateAtMark(' not in text:
              if marker not in text: raise SystemExit('main marker missing')
              text = text.replace(marker, block + marker, 1)
          # Port generic prompt suggestion and make split suggestion delegate to it.
          a = upstream.index('async function suggestSplitPrompt(')
          b = upstream.index('// Valida a chave da OpenAI', a)
          prompt_block = upstream[a:b]
          cur_a = text.index('async function suggestSplitPrompt(')
          cur_b = text.index('// Valida a chave da OpenAI', cur_a)
          text = text[:cur_a] + prompt_block + text[cur_b:]
          # Port IPC handlers for In/Out generation/attachment/suggestion before existing fulfill handlers.
          handler_start = upstream.index("  const janelaDoPedido")
          handler_end = upstream.index("  ipcMain.handle('video:fulfill'", handler_start)
          handler_block = upstream[handler_start:handler_end]
          video_marker = "  ipcMain.handle('video:fulfill'"
          if "preview:generate-at-mark" not in text:
              text = text.replace(video_marker, handler_block + video_marker, 1)
          # Keep EDIT AI wording.
          text = text.replace('seletor do Edvid', 'seletor do EDIT AI').replace('o Edvid', 'o EDIT AI').replace('O Edvid', 'O EDIT AI')
          main.write_text(text)
          # Dedicated regression: verifies the user-facing contract without relying on upstream tests.
          Path('scripts/test-inout-media.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst app=readFileSync('src/App.tsx','utf8');\nconst main=readFileSync('src/main.ts','utf8');\nconst preload=readFileSync('src/preload.ts','utf8');\nconst shared=readFileSync('src/shared.ts','utf8');\nconst edits=readFileSync('src/edit-data-edits.ts','utf8');\nassert.match(app,/useState<'correcao' \\| 'imagem' \\| 'video' \\| 'arquivo'>\\('correcao'\\)/u);\nassert.match(app,/suggestMarkPrompt\\(/u);\nassert.match(main,/async function generateAtMark\\(/u);\nassert.match(main,/async function attachAtMark\\(/u);\nassert.match(main,/async function suggestMediaPrompt\\(/u);\nassert.match(main,/preview:generate-at-mark/u);\nassert.match(main,/preview:attach-at-mark/u);\nassert.match(preload,/generateAtMark/u);\nassert.match(shared,/generateAtMark/u);\nassert.match(edits,/op: 'add-split'/u);\nconsole.log('test:inout-media ok');\n""")
          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          scripts = data.setdefault('scripts', {})
          scripts['test:inout-media'] = 'node scripts/test-inout-media.mjs'
          verify = scripts.get('verify:editai','')
          if 'test:inout-media' not in verify:
              scripts['verify:editai'] = verify + ' && npm run test:inout-media'
          pkg.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm run test:inout-media
          npm run test:edit-data-edits
      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-inout-popover-once.yml
          git add -A
          git commit -m "feat(inout): request media directly from timeline marks"
          git push origin HEAD:editai-inout-popover-20260828
