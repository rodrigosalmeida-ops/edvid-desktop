name: EDIT AI RC2 Windows QA

on:
  workflow_dispatch:
  push:
    branches:
      - editai-v1

permissions:
  contents: read

concurrency:
  group: editai-rc2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editai-rc2-windows:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[install-only]') && !contains(github.event.head_commit.message, '[commercial-release]')) }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      EDITAI_RC2_SOURCE_SHA256: 9f79813ec7ea2315efd75272264f4d6947a4731dc2444faef9f4b828209f88f9
      EDITAI_UPSTREAM_COMMIT: db71373c2613333a80f399e864655c5891a9ea3b

    steps:
      - name: Checkout materialized EDIT AI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source identity and ancestry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:EDITAI_UPSTREAM_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw 'A branch não descende do commit upstream aprovado.' }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.name -ne '@editai/desktop' -or $pkg.productName -ne 'EDIT AI') {
            throw 'A identidade EDIT AI não está materializada na branch.'
          }
          if ($pkg.version -ne '1.0.0-editai.2') {
            throw "Versão RC2 inesperada: $($pkg.version)"
          }
          Write-Host "EDIT AI $($pkg.version) materializado: PASS"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Cache staged EDIT AI runtime
        uses: actions/cache@v4
        with:
          path: |
            resources/runtimes/win32-x64
            .runtime-cache
          key: editai-rc2-win-runtime-v4-${{ hashFiles('resources/runtime-manifest.json', 'scripts/stage-*.mjs', 'scripts/fetch-ffmpeg-win.mjs', 'scripts/editai-ci-stage-torchcodec-prebuilt.mjs') }}
          save-always: true

      - name: Verify EDIT AI RC2
        run: npm run verify:editai

      - name: Stage verified FFmpeg 7.1 LGPL shared runtime for TorchCodec
        run: node scripts/editai-ci-stage-torchcodec-prebuilt.mjs

      - name: Build EDIT-AI-Setup.exe
        shell: powershell
        run: npm run build:editai:win:qa

      - name: Smoke packaged thin EDIT AI executable
        shell: powershell
        run: npm run smoke:editai:win -- -ExecutablePath "out\EDIT AI-win32-x64\EDIT AI.exe" -BootOnly

      - name: Media smoke with bundled EDIT AI FFmpeg
        shell: powershell
        run: npm run smoke:editai:media

      - name: Prepare full-runtime standalone EDIT AI executable
        shell: powershell
        run: npm run package:editai:standalone:win

      - name: Install via Squirrel and smoke installed EDIT AI
        shell: powershell
        run: npm run smoke:editai:install

      - name: Media smoke with installed EDIT AI runtime
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/editai-media-smoke-windows.ps1 -SmokeReportPath out\editai-installed-smoke.json -OutputPath out\editai-installed-media-smoke.json

      - name: Cache EDIT AI WhisperX models and Remotion runtime
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Roaming\EDIT AI\cache\huggingface
            ~\AppData\Roaming\EDIT AI\runtime\remotion
            ~\AppData\Local\uv
          key: editai-e2e-runtime-v1-${{ hashFiles('resources/runtime-manifest.json', 'resources/remotion-template/package.json', 'scripts/editai-e2e-real-video-windows.ps1') }}
          save-always: true

      - name: Real video E2E with installed EDIT AI
        shell: powershell
        run: npm run smoke:editai:e2e

      - name: Build RC2 evidence report
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out\make\squirrel.windows\x64'
          $setup = Get-Item (Join-Path $root 'EDIT-AI-Setup.exe') -ErrorAction Stop
          $nupkg = Get-ChildItem $root -File -Filter '*.nupkg' | Select-Object -First 1
          $releases = Get-Item (Join-Path $root 'RELEASES') -ErrorAction Stop
          if (-not $nupkg) { throw 'EDIT AI .nupkg não foi gerado.' }
          foreach ($reportName in @('editai-smoke.json','editai-media-smoke.json','editai-installed-smoke.json','editai-install-smoke.json','editai-installed-media-smoke.json','editai-e2e-real-report.json','editai-e2e-real-summary.json','editai-windows-artifacts.json')) {
            $reportPath = Join-Path $PWD "out\$reportName"
            if (-not (Test-Path $reportPath)) { throw "Relatório obrigatório ausente: $reportName" }
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $evidence = [ordered]@{
            schemaVersion = 2
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
            productName = $pkg.productName
            packageName = $pkg.name
            version = $pkg.version
            commit = (git rev-parse HEAD).Trim()
            upstreamCommit = $env:EDITAI_UPSTREAM_COMMIT
            rc2SourceSha256 = $env:EDITAI_RC2_SOURCE_SHA256
            setupName = $setup.Name
            setupBytes = $setup.Length
            setupSha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            nupkgName = $nupkg.Name
            nupkgSha256 = (Get-FileHash $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            releasesSha256 = (Get-FileHash $releases.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            verifyEditAi = $true
            packagedSmoke = $true
            mediaSmoke = $true
            squirrelInstall = $true
            installedSmoke = $true
            installedMediaSmoke = $true
            realVideoE2E = $true
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content out\editai-rc2-windows-evidence.json -Encoding UTF8
          Get-Content out\editai-rc2-windows-evidence.json

      - name: Upload EDIT AI RC2 Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-ai-rc2-windows-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            out/make/squirrel.windows/x64/**
            out/editai-windows-artifacts.json
            out/editai-smoke.json
            out/editai-installed-smoke.json
            out/editai-install-smoke.json
            out/editai-media-smoke.json
            out/editai-installed-media-smoke.json
            out/editai-squirrel-diagnostics/**
            out/editai-e2e-real-report.json
            out/editai-e2e-real-summary.json
            out/editai-e2e-real/**
            out/editai-rc2-windows-evidence.json
            out/editai-standalone-evidence.json

      - name: Upload executable EDIT AI standalone with bundled runtimes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edit-ai-standalone-windows-x64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: out/EDIT AI-fat-win32-x64/**
