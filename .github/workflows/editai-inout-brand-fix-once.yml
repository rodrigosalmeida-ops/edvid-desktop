name: EDIT AI In-Out branding fix once

on:
  push:
    branches:
      - editai-inout-brand-fix-20260828
    paths:
      - .github/workflows/editai-inout-brand-fix-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: editai-inout-brand-fix-20260828
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove upstream brand from executable In-Out surface
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          before = text.count('Edvid')
          text = text.replace('O Edvid', 'O EDIT AI').replace('o Edvid', 'o EDIT AI').replace('Edvid está', 'EDIT AI está')
          after = text.count('Edvid')
          if before == after:
              raise SystemExit('No executable upstream-brand occurrence was replaced')
          app.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm run test:inout-media
          node scripts/verify-editai-release.mjs
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-inout-brand-fix-once.yml
          git config user.name editai-ci
          git config user.email actions@users.noreply.github.com
          git add src/App.tsx .github/workflows/editai-inout-brand-fix-once.yml
          git commit -m "fix(brand): keep In-Out surface as EDIT AI"
          git push origin HEAD:editai-inout-brand-fix-20260828
