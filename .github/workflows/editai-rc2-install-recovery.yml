name: EDIT AI RC2 Squirrel Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - editai-v1

permissions:
  actions: read
  contents: read

jobs:
  installed-app-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[install-only]') }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      EDITAI_BUILD_RUN_ID: '33025556126'
      EDITAI_BUILD_ARTIFACT: edit-ai-rc2-windows-11
      EDITAI_BUILD_COMMIT: 9bef29e0443416b01fea57efa1da967be0569568
      EDITAI_RUNTIME_RUN_ID: '33013533038'
      EDITAI_RUNTIME_ARTIFACT: edit-ai-rc2-windows-9
      EDITAI_UPSTREAM_COMMIT: db71373c2613333a80f399e864655c5891a9ea3b
      EDITAI_RC2_SOURCE_SHA256: 9f79813ec7ea2315efd75272264f4d6947a4731dc2444faef9f4b828209f88f9

    steps:
      - name: Checkout installation gate
        uses: actions/checkout@v4

      - name: Download verified RC2 build artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:EDITAI_BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:EDITAI_BUILD_ARTIFACT --dir out
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o artefato do build RC2 aprovado.' }
          if (-not (Test-Path 'out\make\squirrel.windows\x64\EDIT-AI-Setup.exe')) {
            throw 'O artefato recuperado nao contem EDIT-AI-Setup.exe.'
          }

      - name: Verify recovered installer identity
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/editai-inspect-windows-artifacts.ps1

      - name: Recover and verify bundled EDIT AI runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:EDITAI_RUNTIME_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:EDITAI_RUNTIME_ARTIFACT --dir out-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o runtime QA aprovado.' }
          $evidence = Get-Content out-runtime\editai-windows-artifacts.json -Raw | ConvertFrom-Json
          $package = Get-ChildItem out-runtime -Recurse -File -Filter '*.nupkg' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $package) { throw 'Pacote fat aprovado nao contem .nupkg.' }
          $expected = @($evidence.packages | Where-Object { $_.name -eq $package.Name }) | Select-Object -First 1
          if (-not $expected) { throw 'SHA esperado do pacote fat nao foi localizado.' }
          $actual = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne [string]$expected.sha256) { throw 'SHA-256 do pacote fat divergiu da evidencia aprovada.' }
          $extract = Join-Path $PWD 'out-runtime-extracted'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 7z x $package.FullName "-o$extract" 'lib\net45\resources\runtimes\win32-x64\*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao extrair runtimes do pacote fat aprovado.' }
          $runtime = Join-Path $extract 'lib\net45\resources\runtimes\win32-x64'
          if (-not (Test-Path (Join-Path $runtime 'ffmpeg\bin\ffmpeg.exe'))) { throw 'Runtime extraido sem FFmpeg.' }
          if (-not (Test-Path (Join-Path $runtime 'python-whisperx\python\python.exe'))) { throw 'Runtime extraido sem Python/WhisperX.' }
          "EDITAI_QA_RUNTIME_SOURCE=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[EDIT AI] runtime fat verificado e extraido: $runtime"

      - name: Install silently via Squirrel and smoke installed EDIT AI
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/editai-install-smoke-windows.ps1 -RuntimeSource $env:EDITAI_QA_RUNTIME_SOURCE

      - name: Media smoke with installed EDIT AI runtime
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/editai-media-smoke-windows.ps1 -SmokeReportPath out\editai-installed-smoke.json -OutputPath out\editai-installed-media-smoke.json

      - name: Cache EDIT AI WhisperX models and Remotion runtime
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Roaming\EDIT AI\cache\huggingface
            ~\AppData\Roaming\EDIT AI\runtime\remotion
            ~\AppData\Local\uv
          key: editai-e2e-runtime-v1-${{ hashFiles('resources/runtime-manifest.json', 'resources/remotion-template/package.json', 'scripts/editai-e2e-real-video-windows.ps1') }}
          save-always: true

      - name: Real video E2E with installed EDIT AI
        shell: powershell
        run: npm run smoke:editai:e2e

      - name: Build installed-app evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out\make\squirrel.windows\x64'
          $setup = Get-Item (Join-Path $root 'EDIT-AI-Setup.exe') -ErrorAction Stop
          $nupkg = Get-ChildItem $root -File -Filter '*.nupkg' | Select-Object -First 1
          $releases = Get-Item (Join-Path $root 'RELEASES') -ErrorAction Stop
          if (-not $nupkg) { throw 'EDIT AI .nupkg ausente.' }
          foreach ($reportName in @('editai-installed-smoke.json','editai-install-smoke.json','editai-installed-media-smoke.json','editai-e2e-real-report.json','editai-e2e-real-summary.json','editai-windows-artifacts.json')) {
            if (-not (Test-Path (Join-Path $PWD "out\$reportName"))) { throw "Relatorio ausente: $reportName" }
          }
          $evidence = [ordered]@{
            schemaVersion = 2
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
            productName = 'EDIT AI'
            version = '1.0.0-editai.2'
            gateCommit = (git rev-parse HEAD).Trim()
            buildCommit = $env:EDITAI_BUILD_COMMIT
            buildRunId = $env:EDITAI_BUILD_RUN_ID
            upstreamCommit = $env:EDITAI_UPSTREAM_COMMIT
            rc2SourceSha256 = $env:EDITAI_RC2_SOURCE_SHA256
            setupName = $setup.Name
            setupBytes = $setup.Length
            setupSha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            nupkgName = $nupkg.Name
            nupkgSha256 = (Get-FileHash $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            releasesSha256 = (Get-FileHash $releases.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            verifyEditAi = $true
            packagedSmoke = $true
            packagedMediaSmoke = $true
            squirrelInstall = $true
            installedSmoke = $true
            installedMediaSmoke = $true
            realVideoE2E = $true
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content out\editai-rc2-installed-evidence.json -Encoding UTF8
          Get-Content out\editai-rc2-installed-evidence.json

      - name: Upload final EDIT AI RC2 Windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: edit-ai-rc2-windows-installed-${{ github.run_number }}
          retention-days: 14
          path: |
            out/make/squirrel.windows/x64/EDIT-AI-Setup.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/editai-windows-artifacts.json
            out/editai-installed-smoke.json
            out/editai-install-smoke.json
            out/editai-installed-media-smoke.json
            out/editai-e2e-real-report.json
            out/editai-e2e-real-summary.json
            out/editai-e2e-real/**
            out/editai-squirrel-diagnostics/**
            out/editai-rc2-installed-evidence.json
