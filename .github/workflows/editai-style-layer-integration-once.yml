name: EDIT AI style-layer integration once

on:
  push:
    branches:
      - editai-style-layer-integration-20260827
    paths:
      - .github/workflows/editai-style-layer-integration-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: editai-style-layer-integration-20260827
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded style-layer integration
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')

          old_import = "import { FilaDeTrabalho } from './work-queue';"
          new_import = old_import + "\nimport { STYLE_LAYERS, mergeStyleLayers, type StyleLayer } from './style-layers';"
          if old_import not in text:
              raise SystemExit('Guard failed: work-queue import changed')
          text = text.replace(old_import, new_import, 1)

          start = text.find('async function writeEditData(')
          if start < 0:
              raise SystemExit('Guard failed: writeEditData not found')
          end = text.find('\n}\n', start)
          if end < 0:
              raise SystemExit('Guard failed: writeEditData end not found')
          body = text[start:end+3]

          sig_old = "    segments: readonly PlanSegment[];\n  },\n): Promise<{ splits: number; flashes: number }> {"
          sig_new = "    segments: readonly PlanSegment[];\n  },\n  // Aplicação parcial: por padrão preserva o comportamento antigo e aplica tudo.\n  layers: readonly StyleLayer[] = STYLE_LAYERS,\n): Promise<{ splits: number; flashes: number }> {"
          if sig_old not in body:
              raise SystemExit('Guard failed: writeEditData signature changed')
          body = body.replace(sig_old, sig_new, 1)

          doc_old = '  const document: Record<string, unknown> = {'
          doc_new = '  const completeDocument: Record<string, unknown> = {'
          if doc_old not in body:
              raise SystemExit('Guard failed: edit-data document declaration changed')
          body = body.replace(doc_old, doc_new, 1)

          write_marker = "  await writeFile(file, `${JSON.stringify(document, null, 2)}\\n`);"
          if write_marker not in body:
              raise SystemExit('Guard failed: edit-data write marker changed')
          body = body.replace(
              write_marker,
              "  const document = mergeStyleLayers({ previous, next: completeDocument, layers });\n" + write_marker,
              1,
          )

          return_old = "  return { splits: splits.length, flashes: animations.filter(ehFlash).length };\n  // Se a trilha ja estiver na pasta, liga na hora.\n  await ensureSoundtrackFile(path.resolve(publicDirectory, '..', '..', '..'), publicDirectory).catch(() => {});"
          return_new = "  // Se a trilha ja estiver na pasta, liga na hora. Isso precisa rodar antes do return.\n  await ensureSoundtrackFile(path.resolve(publicDirectory, '..', '..', '..'), publicDirectory).catch(() => {});\n  const finalSplits = Array.isArray(document.splits) ? document.splits : [];\n  const finalAnimations = Array.isArray(document.animations)\n    ? (document.animations as Record<string, unknown>[])\n    : [];\n  return { splits: finalSplits.length, flashes: finalAnimations.filter(ehFlash).length };"
          if return_old not in body:
              raise SystemExit('Guard failed: writeEditData return/soundtrack block changed')
          body = body.replace(return_old, return_new, 1)

          text = text[:start] + body + text[end+3:]
          main.write_text(text, encoding='utf-8')

          test = Path('scripts/test-style-layer-integration.mjs')
          test.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const source = readFileSync(path.join(root, 'src', 'main.ts'), 'utf8');
          const start = source.indexOf('async function writeEditData(');
          const end = source.indexOf('\n}\n', start);
          assert.ok(start >= 0 && end > start, 'writeEditData precisa existir');
          const body = source.slice(start, end + 3);
          assert.match(source, /import \{ STYLE_LAYERS, mergeStyleLayers, type StyleLayer \} from '\.\/style-layers';/u);
          assert.match(body, /layers: readonly StyleLayer\[\] = STYLE_LAYERS/u, 'chamadas antigas devem continuar aplicando todas as camadas');
          assert.match(body, /mergeStyleLayers\(\{ previous, next: completeDocument, layers \}\)/u, 'a escrita real precisa passar pela mesclagem por camada');
          const soundtrack = body.indexOf('ensureSoundtrackFile');
          const result = body.indexOf('return { splits: finalSplits.length');
          assert.ok(soundtrack > 0 && result > soundtrack, 'trilha precisa ser habilitada antes do return');
          assert.match(body, /finalSplits = Array\.isArray\(document\.splits\)/u, 'a contagem deve refletir o documento escrito');
          console.log('test:style-layer-integration ok - writeEditData preserves unrelated layers and soundtrack is reachable.');
          """.replace('          ', ''), encoding='utf-8')

          package = Path('package.json')
          package_text = package.read_text(encoding='utf-8')
          script_marker = '    "test:style-layers": "node scripts/test-style-layers.mjs",\n'
          if script_marker not in package_text:
              raise SystemExit('Guard failed: style-layers package script changed')
          package_text = package_text.replace(script_marker, script_marker + '    "test:style-layer-integration": "node scripts/test-style-layer-integration.mjs",\n', 1)
          verify_old = 'npm run test:style-layers && npm run test:editai-diagnostics'
          verify_new = 'npm run test:style-layers && npm run test:style-layer-integration && npm run test:editai-diagnostics'
          if verify_old not in package_text:
              raise SystemExit('Guard failed: verify:editai chain changed')
          package_text = package_text.replace(verify_old, verify_new, 1)
          package.write_text(package_text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Verify style-layer integration
        run: |
          npm run typecheck
          npm run test:style-layers
          npm run test:style-layer-integration
          npm run test:phase2-data

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-style-layer-integration-once.yml
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts scripts/test-style-layer-integration.mjs package.json .github/workflows/editai-style-layer-integration-once.yml
          git commit -m "fix(styles): preserve unrelated layers when writing edit data"
          git push origin HEAD:editai-style-layer-integration-20260827
