""",'image existing placement')
          s=s.replace("if (hubId) return await fulfillImagesFromHub(hubId, imagesDirectory, requestsFile, requests, pending);","if (hubId) return await fulfillImagesFromHub(hubId, projectDirectory, imagesDirectory, requestsFile, requests, pending);",1)
          # Manual image provider placement: unique done increment in this branch.
