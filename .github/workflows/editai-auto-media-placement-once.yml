name: EDIT AI automatic media placement once

on:
  push:
    branches:
      - editai-auto-media-placement-20260828
    paths:
      - .github/workflows/editai-auto-media-placement-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editai-auto-media-placement-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded automatic placement patch
        run: node scripts/patch-auto-media-placement.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify automatic placement
        run: |
          npm run typecheck
          node scripts/test-auto-media-placement.mjs
          npm run test:split-layout
      - name: Commit verified block
        run: |
          rm .github/workflows/editai-auto-media-placement-once.yml
          rm scripts/patch-auto-media-placement.mjs
          git config user.name editai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "feat(media): place generated media from timeline windows"
          git push origin HEAD:editai-auto-media-placement-20260828

# Bench is intentionally branch-scoped and self-removing after a green run.
