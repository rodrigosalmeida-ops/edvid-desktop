  const tracked = job.then((state) => {
""",'video ready placement')

          # Hub images need projectDirectory and placement accounting.
          s=s.replace("  hubId: GenerationHub,\n  imagesDirectory: string,","  hubId: GenerationHub,\n  projectDirectory: string,\n  imagesDirectory: string,",1)
          s=s.replace("  let done = 0;\n  try {\n    const planned = await generator.plan(\n      pending.map", "  let done = 0;\n  let placed = 0;\n  try {\n    const planned = await generator.plan(\n      pending.map",1)
          once("""        await downloadTo(result.url, path.join(imagesDirectory, request.arquivo));
        done += 1;
""","""        await downloadTo(result.url, path.join(imagesDirectory, request.arquivo));
        done += 1;
