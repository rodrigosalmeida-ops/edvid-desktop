          branch=branch.replace("return { status: 'error', total: pending.length, done, error: failures[0] };","return { status: 'error', total: pending.length, done, placed, error: failures[0], kind: 'imagem' };")
          branch=branch.replace("return { status: 'ready', total: pending.length, done };","if (placed > 0) broadcastCodexEvent({ type: 'workspace-refresh' });\n    return { status: 'ready', total: pending.length, done, placed, kind: 'imagem' };")
          s=s[:branch_start]+branch+s[branch_end:]

          main.write_text(s,encoding='utf-8')

