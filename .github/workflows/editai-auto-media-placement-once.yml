name: EDIT AI automatic media placement once

on:
  push:
    branches:
      - editai-auto-media-placement-20260828
    paths:
      - .github/workflows/editai-auto-media-placement-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editai-auto-media-placement-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect media request contract to generation pipeline
        shell: python
        run: |
          from pathlib import Path

          main=Path('src/main.ts')
          s=main.read_text(encoding='utf-8')
