name: EDIT AI style tabs once

on:
  push:
    branches:
      - editai-style-tabs-20260827
    paths:
      - .github/workflows/editai-style-tabs-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: editai-style-tabs-20260827
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded style tabs patch
        shell: python
        run: |
          from pathlib import Path
          import json

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          anchor = """}) {
            const accentUsed = style.headline === 'realce' || style.headline === 'misto' || style.captions === 'stacked';
            const updateElements = (key: keyof StyleSetup['elements']) => {
          """.replace('            ', '  ')
          replacement = """}) {
            const [activeLayer, setActiveLayer] = useState<StyleLayer>('efeitos');
            const accentUsed = style.headline === 'realce' || style.headline === 'misto' || style.captions === 'stacked';
            const updateElements = (key: keyof StyleSetup['elements']) => {
          """.replace('            ', '  ')
          if text.count(anchor) != 1:
              raise SystemExit('Guard failed: StyleWorkspace state anchor changed')
          text = text.replace(anchor, replacement, 1)

          intro = """        <div className="style-intro">
              <div>
                <h2>Escolha estilos e elementos de edição</h2>
              </div>
            </div>

          """.replace('            ', '  ')
          tabs = intro + """        <div className="style-layer-tabs" role="tablist" aria-label="Camadas de estilo">
              {(['efeitos', 'edicao', 'legendas', 'texto'] as StyleLayer[]).map((layer) => (
                <button
                  type="button"
                  role="tab"
                  aria-selected={activeLayer === layer}
                  className={activeLayer === layer ? 'active' : ''}
                  key={layer}
                  onClick={() => setActiveLayer(layer)}
                >
                  <Icon name={layer === 'efeitos' ? 'sparkles' : layer === 'edicao' ? 'layers' : layer === 'legendas' ? 'captions' : 'text'} />
                  <span>{STYLE_LAYER_LABEL[layer]}</span>
                </button>
              ))}
            </div>

          """.replace('            ', '  ')
          if text.count(intro) != 1:
              raise SystemExit('Guard failed: style intro changed')
          text = text.replace(intro, tabs, 1)

          replacements = [
              (
                  '<section className="style-group">\n          <div className="style-group-head"><div><h3>Tipo de edição</h3></div></div>',
                  '<section className={`style-group${activeLayer === \'edicao\' ? \'\' : \' style-layer-hidden\'}`}>\n          <div className="style-group-head"><div><h3>Tipo de edição</h3></div></div>',
              ),
              (
                  '<section className="style-group accent-group">',
                  '<section className={`style-group accent-group${activeLayer === \'legendas\' || activeLayer === \'texto\' ? \'\' : \' style-layer-hidden\'}`}>',
              ),
              (
                  '<section className="style-group">\n          <div className="style-group-head"><div><h3>Estilo de headline</h3></div></div>',
                  '<section className={`style-group${activeLayer === \'texto\' ? \'\' : \' style-layer-hidden\'}`}>\n          <div className="style-group-head"><div><h3>Estilo de headline</h3></div></div>',
              ),
              (
                  '<section className="style-group">\n          <div className="style-group-head"><div><h3>Estilo de legenda</h3></div></div>',
                  '<section className={`style-group${activeLayer === \'legendas\' ? \'\' : \' style-layer-hidden\'}`}>\n          <div className="style-group-head"><div><h3>Estilo de legenda</h3></div></div>',
              ),
              (
                  '<section className="style-group">\n          <div className="style-group-head"><div><h3>Elementos da edição</h3><p>Desmarcado significa que o elemento ficará fora.</p></div></div>',
                  '<section className={`style-group${activeLayer === \'efeitos\' ? \'\' : \' style-layer-hidden\'}`}>\n          <div className="style-group-head"><div><h3>Elementos da edição</h3><p>Desmarcado significa que o elemento ficará fora.</p></div></div>',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Guard failed: style section changed: {old[:60]}')
              text = text.replace(old, new, 1)

          old_footer = """        <div className="apply-style-layers" aria-label="Aplicar camada de estilo">
              {(['edicao', 'efeitos', 'legendas', 'texto'] as StyleLayer[]).map((layer) => (
                <button
                  type="button"
                  className="btn primary apply-style"
                  key={layer}
                  onClick={() => onApply(layer)}
                  disabled={!canApply || applying || runtime.status === 'installing'}
                  title={`Aplicar somente ${STYLE_LAYER_LABEL[layer]}`}
                >
                  <Icon name="sparkles" /> {runtime.status === 'installing' ? 'Preparando...' : applying ? 'Enviando...' : `Aplicar ${STYLE_LAYER_LABEL[layer]}`}
                </button>
              ))}
            </div>
          """.replace('            ', '  ')
          new_footer = """        <div className="apply-style-layers contextual" aria-label={`Aplicar ${STYLE_LAYER_LABEL[activeLayer]}`}>
              <button
                type="button"
                className="btn primary apply-style"
                onClick={() => onApply(activeLayer)}
                disabled={!canApply || applying || runtime.status === 'installing'}
                title={`Aplicar somente ${STYLE_LAYER_LABEL[activeLayer]}`}
              >
                <Icon name="check" /> {runtime.status === 'installing' ? 'Preparando...' : applying ? 'Aplicando...' : 'Aplicar'}
              </button>
            </div>
          """.replace('            ', '  ')
          if text.count(old_footer) != 1:
              raise SystemExit('Guard failed: style footer changed')
          text = text.replace(old_footer, new_footer, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('src/index.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* EDIT AI style-layer tabs parity */'
          if marker not in css_text:
              css_text += """

          /* EDIT AI style-layer tabs parity */
          .style-layer-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            padding: 0 2px 12px;
            position: sticky;
            top: 0;
            z-index: 8;
            background: var(--panel, #111214);
          }
          .style-layer-tabs button {
            min-height: 42px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 10px;
            background: rgba(255,255,255,.035);
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
          }
          .style-layer-tabs button.active {
            border-color: var(--style-accent);
            background: color-mix(in srgb, var(--style-accent) 14%, transparent);
          }
          .style-layer-tabs svg { width: 16px; height: 16px; }
          .style-layer-hidden { display: none !important; }
          .apply-style-layers.contextual { justify-content: flex-end; }
          .apply-style-layers.contextual .apply-style { width: auto; min-width: 118px; }
          """
          css.write_text(css_text, encoding='utf-8')

          test = Path('scripts/test-style-tabs.mjs')
          test.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const app = readFileSync(path.join(root, 'src', 'App.tsx'), 'utf8');
          const css = readFileSync(path.join(root, 'src', 'index.css'), 'utf8');

          assert.match(app, /useState<StyleLayer>\('efeitos'\)/u, 'aba de estilos precisa ter camada ativa');
          assert.match(app, /style-layer-tabs[\s\S]{0,1200}?STYLE_LAYER_LABEL\[layer\]/u, 'camadas precisam aparecer como abas');
          assert.match(app, /onApply\(activeLayer\)/u, 'Aplicar deve afetar somente a aba ativa');
          assert.ok(!/\(\['edicao', 'efeitos', 'legendas', 'texto'\] as StyleLayer\[\]\)\.map\(\(layer\) => \([\s\S]{0,800}?Aplicar somente/u.test(app), 'não pode restar um botão Aplicar por camada no rodapé');
          assert.match(css, /\.style-layer-hidden\s*\{\s*display:\s*none/u, 'camadas inativas precisam ficar ocultas');
          console.log('style tabs parity: ok');
          """.replace('          ', ''), encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          scripts = data.setdefault('scripts', {})
          scripts['test:style-tabs'] = 'node scripts/test-style-tabs.mjs'
          verify = scripts.get('verify:editai', '')
          if 'npm run test:style-tabs' not in verify:
              scripts['verify:editai'] = verify + (' && ' if verify else '') + 'npm run test:style-tabs'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Verify style tabs parity
        run: |
          npm run typecheck
          npm run test:style-tabs
          npm run test:style-layers
          npm run test:style-layer-integration
          npm run test:phase2-data

      - name: Commit verified style tabs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editai-style-tabs-once.yml
          git config user.name "editai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/index.css scripts/test-style-tabs.mjs package.json .github/workflows/editai-style-tabs-once.yml
          git commit -m "feat(styles): add contextual layer tabs"
          git push origin HEAD:editai-style-tabs-20260827
