name: EDIT AI 0.47 Brand Repair

on:
  push:
    branches:
      - editai-upstream-047

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          ref: editai-upstream-047
          fetch-depth: 0

      - name: Keep EDIT AI identity in executable surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Edvid', 'EDIT AI')
          p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- src/App.tsx; then
            echo "Brand already clean."
            exit 0
          fi
          git config user.name "EDIT AI Merge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix(editai): preserve EDIT AI brand after 0.47 [047-applied]"
          git push origin HEAD:editai-upstream-047
