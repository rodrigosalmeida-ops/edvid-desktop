<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Edvid — prévia ao vivo (experimento)</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0d0d10; color: #f4f4f5; font: 14px -apple-system, system-ui, sans-serif; }
      #raiz { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
      #raiz > div:last-child { flex: 1; max-width: 460px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.sub { color: #8b93a1; margin: 0 0 18px; font-size: 12px; line-height: 1.5; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      td { padding: 7px 0; border-bottom: 1px solid #23252b; }
      td:last-child { text-align: right; font-weight: 700; }
      .rotulo { color: #8b93a1; font-weight: 400; }
      .bom { color: #4fd08b; } .medio { color: #e8c15a; } .ruim { color: #f2705f; }
      button {
        margin-top: 16px; padding: 9px 14px; border-radius: 9px; cursor: pointer;
        border: 1px solid #33363e; background: #191b20; color: #f4f4f5; font: inherit; font-weight: 600;
      }
      button:hover { border-color: #ff7713; }
      #veredito { margin-top: 16px; padding: 12px; border-radius: 10px; background: #16181d; line-height: 1.5; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
